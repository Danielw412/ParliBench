name: Deploy Cloudflare backend
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: parlibench-backend-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Configure production binding and custom domain
        run: node scripts/configure-production.mjs
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          BACKEND_DOMAIN: ${{ vars.BACKEND_DOMAIN }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
      - name: Apply migrations
        run: npx wrangler d1 migrations apply parlibench --remote
      - name: Deploy backend and secrets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            ADMIN_SECRET
            PIN_PEPPER
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          PIN_PEPPER: ${{ secrets.PIN_PEPPER }}
